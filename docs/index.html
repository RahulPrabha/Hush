<head>

<title>Hush</title>

<style>
:root{color-scheme:light dark;--bg:#fbfaf8;--fg:#1d1c1a;--muted:#5f5b55;--line:#e3dfd8;--link:#8a4b1f}
@media (prefers-color-scheme:dark){:root{--bg:#161412;--fg:#ece8e2;--muted:#a8a29a;--line:#2e2a26;--link:#e0a576}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif}
main{max-width:42rem;margin:0 auto;padding:2.5rem 1.25rem 4rem}
h1{font-size:2rem;line-height:1.2;margin:0 0 .25rem}h2{font-size:1.2rem;margin:2rem 0 .5rem}h3{font-size:1rem;margin:1.25rem 0 .25rem}
p,ul,ol{margin:.5rem 0}.meta{color:var(--muted);margin-bottom:1.5rem}a{color:var(--link)}
code{font:.9em ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--line);padding:.1em .35em;border-radius:4px;overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
nav{font-size:.9rem;color:var(--muted);margin-bottom:2rem}footer{margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Hush</h1>

</ul>
<footer><a href="index.html">Hush</a> · <a href="privacy.html">Privacy Policy</a> · <a href="support.html">Support</a></footer>
</main>
</body>
</html>
